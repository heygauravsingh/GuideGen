<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GuideGen — opening the editor</title>
<!--
  Retired. The editor lives on the dashboard now — one editor instead of two
  hand-kept-in-parity copies, which is what produced the unstyled-dialog bug.

  This page only still exists so bookmarks and pinned tabs from v1.0 land
  somewhere sensible, carrying their guide id across. Nothing here renders a
  guide; background.js opens the dashboard directly.
-->
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: #ffffff; color: #3d4657; text-align: center; padding: 24px;
  }
  a { color: #6d28d9; }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0e15; color: #bcc4d2; }
    a { color: #8b5cf6; }
  }
</style>
</head>
<body>
  <div>
    <p>The guide editor has moved to your dashboard.</p>
    <p><a id="link" href="https://guide-gen.vercel.app/app">Open it now</a></p>
  </div>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://guide-gen.vercel.app/app" />
  </noscript>
  <!-- Extension-page CSP forbids inline script, so the redirect is its own file. -->
  <script src="redirect.js"></script>
</body>
</html>
