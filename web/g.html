<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Guides can contain internal SOPs. Never index them. The same header is set
     in vercel.json for /g/* — belt and braces, since a missing header here would
     be a disclosure rather than a cosmetic bug. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<title>Guide — GuideGen</title>
<!-- The generic preview, and the fallback if a preview bot is not on the list in
     vercel.json. A bot that *is* on it never reaches this file: /g/:id is rewritten
     to /api/og, which injects this guide's own title. See web/api/og.js. -->
<!-- Link preview. Absolute URLs, because every crawler resolves these against
     nothing — a relative og:image silently yields no image at all. The banner is
     generated by tools/make-og.mjs and committed; a shared *guide* gets its own
     title injected by web/api/og.js and uses og-guide.png. -->
<meta property="og:site_name" content="GuideGen" />
<meta property="og:type" content="article" />
<meta property="og:title" content="A step-by-step guide · GuideGen" />
<meta property="og:description" content="Made with GuideGen — record a workflow once and get the steps back automatically, as a guide for a person or a handoff for an AI." />
<meta property="og:url" content="https://guide-gen.vercel.app/" />
<meta property="og:image" content="https://guide-gen.vercel.app/og-guide.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="GuideGen — a recorded workflow turned into numbered steps" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="A step-by-step guide · GuideGen" />
<meta name="twitter:description" content="Made with GuideGen — record a workflow once and get the steps back automatically, as a guide for a person or a handoff for an AI." />
<meta name="twitter:image" content="https://guide-gen.vercel.app/og-guide.png" />
<!-- Icons. The SVG is the primary — crisp at any size, and the ochre tile reads on
     both a light and a dark tab strip, same reasoning as the toolbar icon. The .ico
     is for browsers that don't take an SVG, and for anything that requests
     /favicon.ico regardless of the markup. All generated by tools/make-icons.mjs. -->
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- Sets data-theme before the stylesheet applies, so there is no flash of the
     wrong theme on load. Must stay above the <link>. -->
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/site.css" />
</head>
<body>

<header class="site">
  <div class="row vrow">
    <a class="brand" href="/">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h7"/></svg></span>
      <span>GuideGen</span>
    </a>
    <!-- Both filled and shown by viewer.js once the reader has scrolled past the
         title: six thousand pixels into a guide, a header that only says "GuideGen"
         has stopped telling you what you are reading. -->
    <span class="hdr-title" id="hdr-title"></span>
    <span class="spacer"></span>
    <span class="hdr-step" id="hdr-step"></span>
    <nav>
      <button class="btn" id="copy-btn" style="padding:8px 13px;font-size:13.5px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>
        <span class="t">Copy link</span>
      </button>
      <button class="btn" id="print-btn" style="padding:8px 13px;font-size:13.5px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>
        <span class="t">Print</span>
      </button>
      <!-- Filled by viewer.js only when the owner has switched exports on. -->
      <span id="export-slot"></span>
    </nav>
  </div>
  <!-- Read progress, along the header's own bottom edge. -->
  <div class="hdr-bar" id="hdr-bar"></div>
</header>

<!-- The growth loop, positioned where it can be seen. Filled by viewer.js, shown
     only once the reader is into the guide, and dismissible. -->
<div class="promo" id="promo"></div>

<main class="wrap narrow viewer" id="main">
  <!-- skeleton while loading; replaced wholesale -->
  <div id="loading">
    <div class="vskel title"></div>
    <div class="vskel w40"></div>
    <div style="margin-top:34px">
      <div class="vskel w60"></div>
      <div class="vskel img"></div>
    </div>
  </div>
</main>

<footer class="site">
  <div class="wrap row">
    <span>© 2026 GuideGen</span>
    <span class="spacer"></span>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
  </div>
</footer>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="/assets/gg.js"></script>
<!-- render.js, exporters.js, the bridge and the two exporter libraries are all
     injected on demand by viewer.js. A reader who only reads shouldn't download
     an exporter they never open. -->
<script src="/assets/viewer.js"></script>
</body>
</html>
