<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Your guides — GuideGen</title>
<!-- Icons. The SVG is the primary — crisp at any size, and the ochre tile reads on
     both a light and a dark tab strip, same reasoning as the toolbar icon. The .ico
     is for browsers that don't take an SVG, and for anything that requests
     /favicon.ico regardless of the markup. All generated by tools/make-icons.mjs. -->
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- Sets data-theme before the stylesheet applies, so there is no flash of the
     wrong theme on load. Must stay above the <link>. -->
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/site.css" />
</head>
<body>

<header class="site">
  <div class="row">
    <a class="brand" href="/">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h7"/></svg></span>
      <span>GuideGen</span>
    </a>
    <nav id="nav-signed-out">
      <a href="/">Home</a>
    </nav>
    <nav id="nav-signed-in" hidden>
      <span class="acct" id="acct-email"></span>
      <button class="link-btn" id="sign-out">Sign out</button>
    </nav>
  </div>
</header>

<!-- ============ signed out ============ -->
<main class="auth-wrap" id="view-auth" hidden>
  <div class="auth-card">
    <h1 id="auth-title">Sign in</h1>
    <p class="sub" id="auth-sub">Sign in to edit and share your guides.</p>

    <div id="google-wrap" hidden>
      <button type="button" class="btn google-btn" id="google-btn">
        <!-- Google's mark, drawn rather than fetched. Their brand guidelines require
             the four-colour G, and the four colours are the point of it. -->
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.01-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>
      <div class="or"><span>or</span></div>
    </div>

    <form id="auth-form" novalidate>
      <div class="field" id="name-field" hidden>
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field" id="pw-field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button class="btn brand-btn" type="submit" id="auth-submit">Sign in</button>
    </form>

    <p class="msg" id="auth-msg" role="status" aria-live="polite"></p>

    <div class="auth-alt">
      <span id="alt-text">New here?</span>
      <button type="button" id="alt-toggle">Create an account</button>
    </div>
    <div class="auth-alt" id="forgot-wrap">
      <button type="button" class="link-btn" id="forgot">Forgot your password?</button>
    </div>
  </div>
</main>

<!-- ============ library ============ -->
<main class="wrap dash" id="view-lib" hidden>
  <div class="dash-head">
    <div>
      <h1>Your guides</h1>
      <p id="dash-sub">Guides on this device, and the ones you've shared.</p>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      Refresh
    </button>
  </div>

  <div class="ext-note" id="ext-note" hidden></div>
  <div id="list"></div>
  <p class="msg" id="dash-msg" role="status" aria-live="polite"></p>
</main>

<!-- ============ editor ============ -->
<main class="wrap ed" id="view-editor" hidden>
  <div class="ed-top">
    <button class="btn icon" id="ed-back" title="Back to your guides" aria-label="Back to your guides">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title-wrap">
      <input id="ed-title" class="ed-title" placeholder="Untitled guide" aria-label="Guide title" />
      <div class="submeta" id="ed-meta"></div>
    </div>
    <span class="spacer"></span>

    <button class="btn" id="ed-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Note
    </button>

    <!-- One place to read every request in the guide, in full. The inline view on a
         step stays deliberately tiny; this is where "show me everything" lives.
         Hidden unless the guide actually has a log. -->
    <button class="btn" id="ed-netlog" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3"/></svg>
      <span id="ed-netlog-label">API log</span>
    </button>

    <div class="menu-wrap">
      <button class="btn" id="ed-export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
        Export
      </button>
      <div class="menu" id="ed-export-menu">
        <!-- First, and on its own, because it is the handoff this product is for:
             the steps as text a model can act on, copied straight to the clipboard
             rather than downloaded — the destination is a chat window. -->
        <div class="lbl">Hand off</div>
        <button data-x="ai"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M3 12h3M18 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="3.2"/></svg></span><span class="txt">Copy for AI<small>Steps, actions and URLs as text</small></span></button>
        <div class="sep"></div>
        <div class="lbl">Documents</div>
        <button data-x="html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/></svg></span><span class="txt">Web page<small>Self-contained .html</small></span></button>
        <button data-x="md"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M15 19l2 2 4-4"/></svg></span><span class="txt">Markdown<small>.md with embedded images</small></span></button>
        <button data-x="pdf"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M19 8v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7z"/><path d="M9 14h6M9 17h4"/></svg></span><span class="txt">PDF document<small>Title page + steps</small></span></button>
        <button data-x="pptx"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg></span><span class="txt">PowerPoint<small>One slide per step</small></span></button>
        <div class="sep"></div>
        <div class="lbl">Video</div>
        <button data-x="video"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg></span><span class="txt">Narrated video<small>1080p .webm, rendered by the extension</small></span></button>
      </div>
    </div>

    <button class="btn brand-btn" id="ed-share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      <span id="ed-share-label">Share</span>
    </button>

    <button class="btn danger icon" id="ed-delete" title="Delete this guide" aria-label="Delete this guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
    </button>
  </div>

  <!-- The one part of a shared guide written for the reader rather than derived from
       what was recorded. Optional, and absent from the published page when empty. -->
  <textarea id="ed-desc" class="ed-desc" rows="2" maxlength="600"
            placeholder="Add a short intro for whoever you share this with (optional)"
            aria-label="Guide description"></textarea>

  <div class="ed-banner" id="ed-banner" hidden></div>
  <div id="ed-steps"></div>
  <section class="activity" id="ed-activity" hidden></section>
  <p class="msg" id="ed-msg" role="status" aria-live="polite"></p>
</main>

<footer class="site">
  <div class="wrap row">
    <span>© 2026 GuideGen</span>
    <span class="spacer"></span>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="mailto:heygauravsingh@gmail.com">Contact</a>
  </div>
</footer>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="/assets/gg.js"></script>
<script src="/assets/bridge.js"></script>
<script src="/assets/render.js"></script>
<script src="/assets/exporters.js"></script>
<script src="/assets/publish.js"></script>
<!-- jsPDF and PptxGenJS are 840KB between them and most sessions never export a
     document, so app.js loads them on demand rather than on every page view. -->
<script src="/assets/app.js"></script>
</body>
</html>
