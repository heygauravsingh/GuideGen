<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Your guides — GuideGen</title>
<link rel="stylesheet" href="/assets/site.css" />
</head>
<body>

<header class="site">
  <div class="row">
    <a class="brand" href="/">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h7"/></svg></span>
      <span>GuideGen</span>
    </a>
    <nav id="nav-signed-out">
      <a href="/">Home</a>
    </nav>
    <nav id="nav-signed-in" hidden>
      <span class="acct" id="acct-email"></span>
      <button class="link-btn" id="sign-out">Sign out</button>
    </nav>
  </div>
</header>

<!-- ============ signed out ============ -->
<main class="auth-wrap" id="view-auth" hidden>
  <div class="auth-card">
    <h1 id="auth-title">Sign in</h1>
    <p class="sub" id="auth-sub">Sign in to edit and share your guides.</p>

    <form id="auth-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field" id="pw-field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button class="btn brand-btn" type="submit" id="auth-submit">Sign in</button>
    </form>

    <p class="msg" id="auth-msg" role="status" aria-live="polite"></p>

    <div class="auth-alt">
      <span id="alt-text">New here?</span>
      <button type="button" id="alt-toggle">Create an account</button>
    </div>
    <div class="auth-alt" id="forgot-wrap">
      <button type="button" class="link-btn" id="forgot">Forgot your password?</button>
    </div>
  </div>
</main>

<!-- ============ library ============ -->
<main class="wrap dash" id="view-lib" hidden>
  <div class="dash-head">
    <div>
      <h1>Your guides</h1>
      <p id="dash-sub">Guides on this device, and the ones you've shared.</p>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      Refresh
    </button>
  </div>

  <div class="ext-note" id="ext-note" hidden></div>
  <div id="list"></div>
  <p class="msg" id="dash-msg" role="status" aria-live="polite"></p>
</main>

<!-- ============ editor ============ -->
<main class="wrap ed" id="view-editor" hidden>
  <div class="ed-top">
    <button class="btn icon" id="ed-back" title="Back to your guides" aria-label="Back to your guides">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title-wrap">
      <input id="ed-title" class="ed-title" placeholder="Untitled guide" aria-label="Guide title" />
      <div class="submeta" id="ed-meta"></div>
    </div>
    <span class="spacer"></span>

    <button class="btn" id="ed-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Note
    </button>

    <div class="menu-wrap">
      <button class="btn" id="ed-export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
        Export
      </button>
      <div class="menu" id="ed-export-menu">
        <div class="lbl">Documents</div>
        <button data-x="html"><span class="ico">🌐</span><span class="txt">Web page<small>Self-contained .html</small></span></button>
        <button data-x="md"><span class="ico">📝</span><span class="txt">Markdown<small>.md with embedded images</small></span></button>
        <button data-x="pdf"><span class="ico">📄</span><span class="txt">PDF document<small>Title page + steps</small></span></button>
        <button data-x="pptx"><span class="ico">📊</span><span class="txt">PowerPoint<small>One slide per step</small></span></button>
        <div class="sep"></div>
        <div class="lbl">Video</div>
        <button data-x="video"><span class="ico">🎬</span><span class="txt">Narrated video<small>1080p .webm, rendered by the extension</small></span></button>
      </div>
    </div>

    <button class="btn brand-btn" id="ed-share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      <span id="ed-share-label">Share</span>
    </button>

    <button class="btn danger icon" id="ed-delete" title="Delete this guide" aria-label="Delete this guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
    </button>
  </div>

  <div class="ed-banner" id="ed-banner" hidden></div>
  <div id="ed-steps"></div>
  <p class="msg" id="ed-msg" role="status" aria-live="polite"></p>
</main>

<footer class="site">
  <div class="wrap row">
    <span>© 2026 GuideGen</span>
    <span class="spacer"></span>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="mailto:gaurav.singh@uengage.in">Contact</a>
  </div>
</footer>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="/assets/gg.js"></script>
<script src="/assets/bridge.js"></script>
<script src="/assets/render.js"></script>
<script src="/assets/exporters.js"></script>
<script src="/assets/publish.js"></script>
<!-- jsPDF and PptxGenJS are 840KB between them and most sessions never export a
     document, so app.js loads them on demand rather than on every page view. -->
<script src="/assets/app.js"></script>
</body>
</html>
