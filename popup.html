<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* Ink & Paper. Kept in lockstep with web/assets/site.css by hand — an extension
     page can't load a stylesheet from the website, so every token exists twice.
     If you change one, change the other. */
  :root {
    --brand: #c2410c;
    --brand-2: #9e340a;
    --on-brand: #fffdfa;
    --pri: #1a1713;
    --pri-2: #322b23;
    --pri-fg: #fbfaf7;
    --rec: #c1352c;
    --panel: #fbfaf7;
    --panel-2: #f2eee6;
    --ink: #1a1713;
    --ink-2: #443c31;
    --muted: #6f675b;
    --line: #e5dfd2;
    --ok: #16643f;
    --err: #a8321f;
    --r: 9px;
    color-scheme: light;
  }
  /* Dark is whatever the dashboard was set to, not what the OS says — popup.js
     stamps data-theme from chrome.storage before the first paint. Without this the
     popup sat in dark mode while the editor was light, on the same screen.
     The OS media query is the fallback for anyone who has never set a preference. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand: #e08a4f; --brand-2: #eb9c65; --on-brand: #21180f;
    --pri: #f2ede3; --pri-2: #ffffff; --pri-fg: #15130f;
    --rec: #ef7a72;
    --panel: #17150f; --panel-2: #201d17;
    --ink: #f2ede3; --ink-2: #cbc2b1; --muted: #9a9080; --line: #332e26;
    --ok: #63c08e; --err: #f0897c;
  }
  * { box-sizing: border-box; }
  /* One frame of the wrong colours is very visible in a 296px panel. popup.js
     removes this as soon as it has stamped data-theme. */
  body.pre-theme { visibility: hidden; }
  /* No max-height or overflow here on purpose, and it was tried. Chrome caps a popup
     at 600px and scrolls the document itself past that, so a rule of our own is inert
     — measured both ways in a 296x600 viewport, identical. The height is handled by
     the spacing being tight enough that the ordinary armed state fits, and by the
     account row's bottom padding being large enough that a small overflow clips
     whitespace rather than words. popup.js deliberately does **not** scroll on arming;
     the note there says why. */
  /* **The width goes on `html` as well as `body`, and that is not belt-and-braces.**
     Chrome lays a popup out at its maximum width and then sizes the window to what
     the document says it needs. `body` was 296px and nothing inside it overflowed —
     but `html` had no width, so it stretched to fill the layout width, and the window
     was sized to *that*. The result was a 296px panel sitting in a much wider popup
     with a large blank area down the right-hand side, on every page, since the popup
     was written. Constrain the root and the document's preferred width is the panel's
     width, which is what Chrome measures. Keep the two numbers identical. */
  html, body { width: 296px; background: var(--panel); }
  /* **The scrollbar must not be allowed to change the popup's width.**
     Arming catch-up capture takes the content past Chrome's 600px popup ceiling, so a
     vertical scrollbar appears. `html` and `body` are pinned at exactly 296px, so a
     classic scrollbar cannot come out of that width — the document becomes 296 + ~15px
     and Chrome re-sizes the window to match. The panel visibly jumps wider the instant
     the switch is touched, which is the "abruptly widens" everyone can see and nobody
     can explain from the markup, because nothing in the markup got wider.

     Hidden rather than reserved with `scrollbar-gutter: stable`: a reserved gutter is a
     permanent ~15px strip of empty panel down the right-hand side, which is the *other*
     complaint this popup already had. The document still scrolls with a wheel or a
     trackpad; only the bar is gone. Whether the bar takes layout space at all depends on
     the pointing device — a Mac trackpad gets overlay scrollbars and a mouse gets classic
     ones — which is exactly why this cannot be left to chance. */
  html { scrollbar-width: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 16px 9px;
  }
  header .logo {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--pri); color: var(--pri-fg);
    display: grid; place-items: center; flex: none;
  }
  header .logo svg { width: 15px; height: 15px; }
  header h1 { font-size: 14.5px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }

  .card {
    margin: 0 12px; padding: 12px;
    background: var(--panel-2); border-radius: var(--r);
    display: flex; align-items: center; gap: 11px;
  }
  .card .pip {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted); flex: none;
  }
  body.rec .card .pip { background: var(--rec); animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(193, 53, 44, 0.5); }
    50% { opacity: 0.75; box-shadow: 0 0 0 5px rgba(193, 53, 44, 0); }
  }
  .card .txt { min-width: 0; }
  .card .txt b { display: block; font-size: 13px; font-weight: 650; }
  .card .txt small { color: var(--muted); font-size: 11.5px; }

  .actions { padding: 10px 12px; display: grid; gap: 6px; }
  button {
    width: 100%; border: 1px solid transparent; border-radius: var(--r);
    padding: 11px 12px; font: inherit; font-size: 13.5px; font-weight: 650;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 120ms, transform 120ms;
  }
  button:active { transform: translateY(1px); }
  button svg { width: 15px; height: 15px; flex: none; }
  .primary { background: var(--pri); color: var(--pri-fg); }
  .primary:hover { background: var(--pri-2); }
  body.rec .primary { background: var(--rec); color: #fffdfa; }
  body.rec .primary:hover { filter: brightness(1.08); }
  .ghost { background: transparent; color: var(--ink-2); border-color: var(--line); }
  .ghost:hover { background: var(--panel-2); }

  .hint {
    font-size: 11px; color: var(--muted); line-height: 1.5;
    padding: 2px 16px 11px; margin: 0;
  }

  /* ---------- auth gate ---------- */
  [hidden] { display: none !important; }
  .auth { padding: 4px 16px 14px; }
  .auth h2 { font-size: 13.5px; font-weight: 650; margin: 0 0 3px; }
  .auth p { font-size: 11.5px; color: var(--muted); margin: 0 0 13px; line-height: 1.5; }
  .field { margin-bottom: 9px; }
  .field label {
    display: block; font-size: 11px; font-weight: 600;
    color: var(--ink-2); margin-bottom: 4px;
  }
  /* The extension and the website don't share CSS, so every control on both
     surfaces has to be styled twice. Skipping this is what once left the
     editor's dialog inputs as a white UA box on a dark panel. */
  .field input {
    width: 100%; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--panel-2); color: var(--ink);
    padding: 9px 10px; font: inherit; font-size: 13px; outline: 0;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .field input:focus {
    border-color: var(--brand); background: var(--panel);
    box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.24);
  }
  /* Google's guidelines want their mark on a neutral surface, so this is a peer to
     the form rather than a second primary button. Styled here as well as in
     site.css — the two surfaces don't share CSS. */
  .google-btn {
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); font-weight: 600; font-size: 12.5px;
  }
  .google-btn:hover { background: var(--panel-2); }
  .google-btn svg { flex: none; }
  .or {
    display: flex; align-items: center; gap: 10px;
    margin: 11px 0; color: var(--muted); font-size: 10.5px;
  }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .msg { font-size: 11.5px; line-height: 1.45; margin: 8px 0 0; min-height: 16px; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .alt { margin-top: 11px; font-size: 11.5px; color: var(--muted); text-align: center; }
  .alt button {
    display: inline; width: auto; padding: 0; border: 0; background: none;
    color: var(--brand); font: inherit; font-weight: 650; cursor: pointer;
  }
  .alt button:hover { text-decoration: underline; }
  /* The bottom padding is load-bearing, not decoration. The panel legitimately runs
     past Chrome's 600px popup ceiling in some states — a long hostname wraps the
     catch-up line to three lines — and whatever is last gets clipped. With enough
     padding below the text, a small overflow eats the whitespace and every word is
     still readable; without it, the account row is sliced through the middle of the
     letters, which is what made the panel look broken rather than scrollable. Keep
     this at or above ~14px, and never let it fall below the overflow in the armed
     states measured in WORKLOG 23 Aug 2026. */
  .acct {
    display: flex; align-items: center; gap: 6px;
    padding: 0 16px 16px; font-size: 11px; color: var(--muted);
  }
  .acct .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct .spacer { flex: 1; }
  .acct button {
    display: inline; width: auto; padding: 0; border: 0; background: none;
    color: var(--muted); font: inherit; cursor: pointer; text-decoration: underline;
    flex: none;
  }
  .acct button:hover { color: var(--ink-2); }

  /* ---------- catch-up capture ---------- */
  .buf { margin: 0 12px 10px; padding: 10px 12px; background: var(--panel-2); border-radius: var(--r); }
  .buf-top { display: flex; align-items: center; gap: 8px; }
  .buf-t { font-size: 12.5px; font-weight: 650; flex: 1; }
  .buf-sub { margin: 5px 0 0; font-size: 11px; color: var(--muted); line-height: 1.45; }
  .buf-acts { display: flex; gap: 6px; margin-top: 9px; }
  .buf-acts button { width: auto; flex: 1; }
  button.sm { padding: 7px 9px; font-size: 12px; }
  /* Same switch as the dashboard's, at popup scale. Styled here as well because
     the two surfaces cannot share CSS. */
  .buf-sw { position: relative; flex: none; cursor: pointer; display: block; }
  .buf-sw input { position: absolute; opacity: 0; width: 0; height: 0; }
  .buf-track {
    display: block; width: 34px; height: 20px; border-radius: 999px;
    background: var(--line); transition: background 120ms;
  }
  .buf-track::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%; background: var(--panel);
    transition: transform 120ms;
  }
  /* Ink, not the accent — same as the dashboard's switch. The accent is reserved
     for things that mean something (a step number, an annotation, the recording
     light); "this toggle is on" is not one of them. */
  .buf-sw input:checked + .buf-track { background: var(--pri); }
  .buf-sw input:checked + .buf-track::after { transform: translateX(14px); }
  .buf-sw input:focus-visible + .buf-track { box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.24); }

  /* An opt-in with its consequence written next to it. A checkbox whose label is
     three words and whose effect is "share your API responses" is not a choice
     anyone made, so the small print is part of the control, not a footnote. */
  .opt { display: flex; gap: 9px; margin: 0 12px 10px; cursor: pointer; align-items: flex-start; }
  .opt.tight { margin: 10px 0 0; }
  .opt input { margin: 2px 0 0; flex: none; width: 14px; height: 14px; accent-color: var(--pri); }
  .opt b { display: block; font-size: 12.5px; font-weight: 650; }
  .opt small { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); line-height: 1.45; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="pre-theme">
  <header>
    <span class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h10M4 12h16M4 18h7" />
      </svg>
    </span>
    <h1>GuideGen</h1>
  </header>

  <!-- ============ signed out ============ -->
  <div class="auth" id="viewAuth" hidden>
    <h2 id="authTitle">Sign in</h2>
    <p id="authSub">GuideGen needs an account before it records.</p>

    <div id="googleWrap" hidden>
      <button type="button" class="google-btn" id="googleBtn">
        <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.01-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>
      <div class="or"><span>or</span></div>
    </div>

    <form id="authForm" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button class="primary" type="submit" id="authSubmit">Sign in</button>
    </form>

    <p class="msg" id="authMsg" role="status" aria-live="polite"></p>

    <div class="alt">
      <span id="altText">New here?</span>
      <button type="button" id="altToggle">Create an account</button>
    </div>
    <div class="alt" id="forgotWrap">
      <button type="button" id="forgot">Forgot your password?</button>
    </div>
  </div>

  <!-- ============ signed in ============ -->
  <div id="viewMain" hidden>
    <div class="card">
      <span class="pip"></span>
      <span class="txt">
        <b id="statusTitle">Ready to record</b>
        <small id="statusSub">Every click becomes a step</small>
      </span>
    </div>

    <div class="actions">
      <button id="toggle" class="primary">
        <svg id="toggleIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="12" r="7" />
        </svg>
        <span id="toggleLabel">Start recording</span>
      </button>
      <button id="library" class="ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h7l2 2h7v12H4zM4 9h16" />
        </svg>
        Guide library
      </button>
    </div>

    <!-- Tier 2 of the API log, and a decision about *this* recording — so it is
         here beside Start, and it disappears once recording begins because by then
         it is too late to change. Off every time: this is the one thing GuideGen
         records that the user cannot see before they share it. -->
    <label class="opt" id="bodyOpt">
      <input type="checkbox" id="netBodies" />
      <span>
        <b>Include full API requests &amp; responses</b>
        <small>Every request as a copyable cURL, with what came back — including successful
        responses, which may hold real customer data. Credential values are masked and nothing is
        ever uploaded. Off by default; tick it before recording a bug.</small>
      </span>
    </label>

    <p class="hint" id="hint">
      Tip: if a tab was open before you installed GuideGen, reload it once before recording.
    </p>

    <!-- Catch-up capture. Off by default and armed per site, because the only way
         to answer "capture the last 2 minutes" is to have been capturing all
         along — see the note in background.js.

         The primary action is deliberately the *slice*, not everything held: the
         thing people ask for is "what I just did", and the whole session is the
         fallback for when two minutes wasn't enough. -->
    <div class="buf" id="bufCard" hidden>
      <div class="buf-top">
        <span class="buf-t">Catch-up capture</span>
        <label class="buf-sw">
          <input type="checkbox" id="bufArm" />
          <span class="buf-track"></span>
        </label>
      </div>
      <p class="buf-sub" id="bufSub"></p>
      <div class="buf-acts" id="bufActs" hidden>
        <button class="primary sm" id="bufSlice">Capture last 2 minutes</button>
      </div>
      <div class="buf-acts" id="bufActs2" hidden>
        <button class="ghost sm" id="bufAll">Capture all</button>
        <button class="ghost sm" id="bufClear">Discard</button>
      </div>
      <!-- The same Tier 2 opt-in for catch-up, separate because the exposure is
           different: this one would hold failed request and response bodies for
           seven days, unattended, on every armed site. Its own switch, its own
           decision.

           The title names catch-up rather than repeating the one above it. While a
           site is armed both controls are on screen at once, and two checkboxes
           reading "Include full API requests & responses" a few centimetres apart
           read as the same control drawn twice — which makes the one that is off
           look like a rendering fault rather than a second decision. It has to say
           it in full rather than "include them too": during a recording the control
           above is hidden, so a title that leans on it would have no antecedent. -->
      <label class="opt tight" id="bufBodyOpt" hidden>
        <input type="checkbox" id="bufBodies" />
        <span>
          <b>Include full API requests &amp; responses in catch-up</b>
          <small>Held for 7 days on armed sites, like the rest of the capture.</small>
        </span>
      </label>
    </div>

    <div class="acct">
      <span class="who" id="acctEmail"></span>
      <span class="spacer"></span>
      <button type="button" id="signOut">Sign out</button>
    </div>
  </div>

  <script src="sync.js"></script>
  <script src="popup.js"></script>
</body>
</html>
